
name: OWASP ZAP DAST Security Pipeline

on:
  push:
    branches:
      - fitur-owasp-zap-dast

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-dast-scan:
    name: OWASP ZAP Dynamic Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Build Flask application
      - name: Build Flask Docker Image
        run: |
          docker build -t flask-dast-app:${{ github.sha }} .

      # 3. Start Flask application
      - name: Start Flask Application
        run: |
          docker run -d \
            --name flask-dast-app \
            -p 5000:5000 \
            flask-dast-app:${{ github.sha }}

      # 4. Wait for application readiness
      - name: Wait for Application
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/ > /dev/null; then
              echo "Flask application is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Application failed to start"
          docker logs flask-dast-app
          exit 1

      # 5. Prepare ZAP report directory
      - name: Prepare ZAP Reports
        run: |
          mkdir -p reports
          chmod 777 reports

      # 6. Run OWASP ZAP Baseline Scan
      - name: OWASP ZAP Baseline Security Scan
        run: |
          docker run --rm -t \
            --network host \
            -v "$GITHUB_WORKSPACE/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5000 \
            -r zap-report.html \
            -J zap-report.json \
            -m 1

      # 7. Upload scan reports
      - name: Upload OWASP ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-dast-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      # 8. Cleanup Docker Container
      - name: Cleanup Docker Container
        if: always()
        run: |
          docker rm -f flask-dast-app || true
