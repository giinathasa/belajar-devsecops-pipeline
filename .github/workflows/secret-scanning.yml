name: Secret Scanning (Gitleaks)

on:
  workflow_call:

  workflow_dispatch:

  push:
    branches: ["main", "master"]

  pull_request:
    branches: ["main", "master"]

jobs:
  gitleaks-scan:
    name: Run Gitleaks
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks history commit

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
