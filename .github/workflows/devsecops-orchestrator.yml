
name: DevSecOps Main Pipeline Orchestrator

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # STAGE 1: SECRET SCANNING
  # ==========================================
  gitleaks:
    name: Gitleaks Secret Scanning
    uses: ./.github/workflows/secret-scanning.yml
    secrets: inherit

  # ==========================================
  # STAGE 2: SAST, CODE QUALITY, DEPENDENCY
  # AND SBOM GENERATION
  # ==========================================
  devsecops-ci:
    name: DevSecOps CI Security Checks
    needs: gitleaks
    uses: ./.github/workflows/devsecops.yml
    with:
      orchestrated: true
      deploy_enabled: false

  # ==========================================
  # STAGE 3: DOCKERFILE LINT
  # ==========================================
  dockerfile-lint:
    name: Hadolint Dockerfile Security Check
    needs: devsecops-ci
    uses: ./.github/workflows/dockerfile-lint.yml

  # ==========================================
  # STAGE 4: DYNAMIC APPLICATION SECURITY TESTING
  # ==========================================
  zap-dast:
    name: OWASP ZAP Dynamic Security Testing
    needs: dockerfile-lint
    uses: ./.github/workflows/owasp-zap-dast.yml

  # ==========================================
  # STAGE 5: FINAL SECURITY GATE
  # ==========================================
  security-gate:
    name: Security Gate

    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - devsecops-ci
      - dockerfile-lint
      - zap-dast

    # Tetap jalankan gate untuk mengevaluasi hasil semua job.
    if: always()

    steps:
      - name: Verify All Security Checks
        shell: bash
        run: |
          echo "Checking all security pipeline results..."

          if [[ "${{ needs.gitleaks.result }}" != "success" ]]; then
            echo "Gitleaks failed!"
            exit 1
          fi

          if [[ "${{ needs.devsecops-ci.result }}" != "success" ]]; then
            echo "DevSecOps CI failed!"
            exit 1
          fi

          if [[ "${{ needs.dockerfile-lint.result }}" != "success" ]]; then
            echo "Hadolint failed!"
            exit 1
          fi

          if [[ "${{ needs.zap-dast.result }}" != "success" ]]; then
            echo "OWASP ZAP failed!"
            exit 1
          fi

          echo "=================================="
          echo "ALL SECURITY CHECKS PASSED"
          echo "=================================="

  # ==========================================
  # STAGE 6: DEPLOYMENT TO VM
  # ==========================================
  deploy:
    name: Deploy Application to VMware Server

    needs:
      - security-gate

    # Deployment hanya untuk push ke main.
    # Tidak melakukan deployment ketika Pull Request.
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.security-gate.result == 'success'
      }}

    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t secure-flask-app:latest .

      - name: Stop Previous Container
        run: docker stop web-flask || true

      - name: Remove Previous Container
        run: docker rm web-flask || true

      - name: Deploy New Container
        run: |
          docker run -d \
            -p 5000:5000 \
            --name web-flask \
            --restart unless-stopped \
            secure-flask-app:latest

      - name: Verify Deployment
        run: |
          sleep 5
          docker ps | grep web-flask
          curl -f http://127.0.0.1:5000/
