name: DevSecOps CI/CD Pipeline

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}

jobs:
    # ==========================================
    # CI JOB 1: SAST Scan (Semgrep)
    # ==========================================
    sast-scan:
        name: Semgrep SAST Scan
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Run Semgrep SAST
              # --exclude=".github" mencegah Semgrep memeriksa file workflow YAML
              run: semgrep scan --config auto --error --verbose --exclude=".github"

    # ==========================================
    # CI JOB 2: Code Quality (Pylint)
    # ==========================================
    pylint-check:
        name: Pylint Code Quality Gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pylint
                  pip install -r requirements.txt

            - name: Run Pylint Check
              run: pylint --fail-under=9.0 app.py


    # ==========================================
    # CD STAGE: Build, Scan & Deploy ke VM
    # ==========================================
    deploy-to-vm:
        name: Build, Scan & Deploy to VirtualBox VM
        needs: [sast-scan, pylint-check]
        runs-on: self-hosted
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            # 1. Build Docker Image
            - name: Build Docker Image
              run: docker build -t secure-flask-app:latest .

            # 2. Scan Docker Image dengan Trivy
            - name: Scan Docker Image with Trivy
              run: |
                  docker run --rm \
                    -v /var/run/docker.sock:/var/run/docker.sock \
                    -v "$HOME/.cache/trivy:/root/.cache/trivy" \
                    aquasec/trivy:latest image \
                    --scanners vuln \
                    --severity HIGH,CRITICAL \
                    --exit-code 1 \
                    secure-flask-app:latest

            # 3. Deploy jika scan berhasil
            - name: Deploy Container
              run: |
                  docker stop web-flask || true
                  docker rm web-flask || true
                  docker run -d -p 5000:5000 --name web-flask secure-flask-app:latest
                  docker ps | grep web-flask
