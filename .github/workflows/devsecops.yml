
name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main", "master", "pipeline-tambahan"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: semgrep scan --config auto --error --verbose --exclude=".github"

  pylint-check:
    name: Pylint Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

      - name: Run Pylint Check
        run: pylint --fail-under=9.0 app.py

  
  dependency-scan:
    name: Python Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt


  deploy-to-vm:
    name: Build, Scan & Deploy to VirtualBox VM
    needs: [sast-scan, pylint-check, dependency-scan]
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t secure-flask-app:latest .

      - name: Deploy Container
        run: |
          docker stop web-flask || true
          docker rm web-flask || true
          docker run -d -p 5000:5000 --name web-flask secure-flask-app:latest
          docker ps | grep web-flask
