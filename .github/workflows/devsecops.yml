
name: DevSecOps CI/CD Pipeline

on:
  workflow_call:
    inputs:
      orchestrated:
        description: "Workflow is called by the main orchestrator"
        required: false
        type: boolean
        default: false

      deploy_enabled:
        description: "Enable deployment from this workflow"
        required: false
        type: boolean
        default: true

  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: SAST SCAN (SEMGREP)
  # ==========================================
  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: semgrep scan --config auto --error --verbose --exclude=".github"

  # ==========================================
  # JOB 2: CODE QUALITY (PYLINT)
  # ==========================================
  pylint-check:
    name: Pylint Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

      - name: Run Pylint Check
        run: pylint --fail-under=9.0 app.py

  # ==========================================
  # JOB 3: DEPENDENCY SECURITY SCAN
  # ==========================================
  dependency-scan:
    name: Python Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt

  # ==========================================
  # JOB 4: SBOM GENERATION (SYFT)
  # ==========================================
  sbom-generation:
    name: Syft SBOM Generation
    runs-on: ubuntu-latest
    needs: [sast-scan, pylint-check, dependency-scan]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image for SBOM
        run: docker build -t secure-flask-app:latest .

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: secure-flask-app:latest
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: secure-flask-app-sbom
          upload-artifact: true

  # ==========================================
  # JOB 5: DEPLOYMENT TO VM
  # ==========================================
  deploy-to-vm:
    name: Build, Scan & Deploy to VirtualBox VM

    # Skip deployment when called by orchestrator
    # with deploy_enabled set to false.
    if: ${{ !inputs.orchestrated || inputs.deploy_enabled }}

    needs:
      - sast-scan
      - pylint-check
      - dependency-scan
      - sbom-generation

    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t secure-flask-app:latest .

      - name: Deploy Container
        run: |
          docker stop web-flask || true
          docker rm web-flask || true
          docker run -d -p 5000:5000 --name web-flask secure-flask-app:latest
          docker ps | grep web-flask
